name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: node --check index.mjs
      - name: Tests (permission mapping, sync queue, static checks, sandboxed boot)
        run: node tests/run.mjs
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Release zip from the committed tree, tested after extraction
        run: node scripts/package-release.mjs HEAD
